# Staged release to crates.io, run per registry. dry_run=true (default) builds
# and tests only; a real publish requires dry_run=false plus the matching tag
# input. The tag-driven release.yml remains the full-release path.
name: Release crates.io

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag this publish belongs to (e.g. v0.1.0); required when dry_run=false"
        required: false
        default: ""
      dry_run:
        description: "true = build and test only; false = publish for real"
        required: false
        default: "true"

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: crates
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Verify version against the tag input
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          V="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "manifest version: ${V}"
          if [ -z "${TAG}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "refusing to publish without the 'tag' input"; exit 1
            fi
          else
            if [ "v${V}" != "${TAG}" ]; then
              echo "tag input ${TAG} does not match manifest v${V}"; exit 1
            fi
          fi
      - run: cargo test
      - name: Publish (dry run)
        if: inputs.dry_run == 'true'
        run: |
          cargo publish --dry-run
          echo "DRY RUN passed; the real job would run: cargo publish (CARGO_REGISTRY_TOKEN)"
      - name: Publish
        if: inputs.dry_run != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
