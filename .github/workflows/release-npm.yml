# Staged release to npm, run per registry. dry_run=true (default) builds and
# tests only; a real publish requires dry_run=false plus the matching tag
# input. The tag-driven release.yml remains the full-release path.
name: Release npm

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag this publish belongs to (e.g. v0.1.0); required when dry_run=false"
        required: false
        default: ""
      dry_run:
        description: "true = build and test only; false = publish for real"
        required: false
        default: "true"

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Verify version against the tag input
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "manifest version: ${V}"
          if [ -z "${TAG}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "refusing to publish without the 'tag' input"; exit 1
            fi
          else
            if [ "v${V}" != "${TAG}" ]; then
              echo "tag input ${TAG} does not match manifest v${V}"; exit 1
            fi
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish (dry run)
        if: inputs.dry_run == 'true'
        run: |
          npm pack --dry-run
          echo "DRY RUN passed; the real job would run: npm publish --provenance --access public"
      - name: Publish
        if: inputs.dry_run != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
