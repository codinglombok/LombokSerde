# Staged release to PyPI, run per registry. dry_run=true (default) builds and
# tests only; a real publish requires dry_run=false plus the matching tag
# input. The tag-driven release.yml remains the full-release path.
name: Release PyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag this publish belongs to (e.g. v0.1.0); required when dry_run=false"
        required: false
        default: ""
      dry_run:
        description: "true = build and test only; false = publish for real"
        required: false
        default: "true"

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify version against the tag input
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          V="$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          W="$(grep -m1 '__version__' python/lombokserde/__init__.py | sed 's/.*"\(.*\)".*/\1/')"
          echo "manifest version: ${V} / ${W}"
          if [ "${V}" != "${W}" ]; then
            echo "pyproject version ${V} != __init__ version ${W}"; exit 1
          fi
          if [ -z "${TAG}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "refusing to publish without the 'tag' input"; exit 1
            fi
          else
            if [ "v${V}" != "${TAG}" ]; then
              echo "tag input ${TAG} does not match manifest v${V}"; exit 1
            fi
          fi
      - name: Build and test
        run: |
          python -m pip install --quiet pytest build twine
          python -m pytest -q
        working-directory: python
      - name: Build distributions
        run: python -m build
        working-directory: python
      - name: Check distributions
        run: python -m twine check dist/*
        working-directory: python
      - name: Publish (dry run)
        if: inputs.dry_run == 'true'
        run: |
          ls -l dist
          echo "DRY RUN passed; the real job would run: pypa/gh-action-pypi-publish (trusted publishing, environment pypi)"
        working-directory: python
      - name: Publish
        if: inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
